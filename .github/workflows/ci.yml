name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: Simulator and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: cmake -S sim -B build/sim && cmake --build build/sim -j
      - name: Test
        run: ctest --test-dir build/sim --output-on-failure
      - name: Screenshot
        run: build/sim/vellum-sim --headless --keys nn --screenshot sim-page.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: sim-page.png

  web:
    name: Browser simulator
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sim/web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-simulator-web
          path: build/web/vellum-simulator.html

  firmware:
    name: Firmware (X4 Pro)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-x4pro
          path: |
            build/vellum.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
