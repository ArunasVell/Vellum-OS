name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The "Run workflow" button on the Actions page: builds main and publishes
  # a release. Merges alone only build and test.
  workflow_dispatch:

jobs:
  host:
    name: Simulator and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: cmake -S sim -B build/sim && cmake --build build/sim -j
      - name: Test
        run: ctest --test-dir build/sim --output-on-failure
      - name: Screenshot
        run: build/sim/vellum-sim --headless --time 14:05 --keys onn --screenshot sim-page.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: sim-page.png

  web:
    name: Browser simulator
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sim/web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-simulator-web
          path: build/web/vellum-simulator.html

  firmware:
    name: Firmware (X4 Pro)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history and tags back to the previous release, for its notes
      - name: Version number
        # Each run gets the next number (shared by merges and releases, so
        # release numbers only grow); the reader shows it in Settings ›
        # Device check and on the upload page.
        run: echo "0.1.${{ github.run_number }}" > version.txt
      - name: Release notes
        # What's new since the previous release, grouped into new features,
        # bug fixes and other changes. The firmware carries it (the reader
        # shows it once after updating) and the release page lists it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release_notes.py --repo "${{ github.repository }}" > release-notes.md
          cat release-notes.md
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-x4pro
          path: |
            build/vellum.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
            build/flasher_args.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: ignore
      - name: Installer page
        # One HTML file with the firmware inside: opened in Chrome or Edge it
        # installs Vellum over USB. It needs no internet, so it works as a
        # downloaded file.
        run: python3 tools/make_installer.py build -o vellum-install.html
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-installer
          path: vellum-install.html

  release:
    name: Publish update file
    # Only a manual run on main publishes a release, so readers get one
    # update when the owner asks instead of one per merge. Never mark it a
    # prerelease: the reader's online update reads /releases/latest.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [host, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vellum-x4pro
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: vellum-installer
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          cp out/vellum.bin "vellum-$VERSION.bin"
          cp installer/vellum-install.html "vellum-install-$VERSION.html"
          (cd out && zip -r "../vellum-$VERSION-usb.zip" .)
          {
            echo "First install: download vellum-install-$VERSION.html and open it in Chrome or Edge, then follow the steps (guide: https://github.com/ArunasVell/Vellum-OS/blob/main/docs/install.md). Already on Vellum: the reader updates itself over home Wi-Fi, or send vellum-$VERSION.bin from Settings › Updates › Update from a file. The USB zip is for flashing with esptool. All changes so far: https://github.com/ArunasVell/Vellum-OS/blob/main/CHANGELOG.md"
            if [ -s notes/release-notes.md ]; then
              echo
              echo "## New in this version"
              echo
              cat notes/release-notes.md
            fi
          } > notes.md
          gh release create "v$VERSION" "vellum-$VERSION.bin" "vellum-install-$VERSION.html" "vellum-$VERSION-usb.zip" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Vellum $VERSION" \
            --notes-file notes.md
